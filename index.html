:root {

/* S -> เอกสารในฐานข้อมูล (คะแนนและเช็คชื่อเก็บเป็นเอกสารต่อรายการ/ต่อวัน แก้ทีละคนได้) */
function toDocs() {
  const D = {}; COLS.forEach((c) => { D[c] = {}; });
  D.cfg.main = { rooms: S.rooms, subjects: S.subjects, subjectTeachers: S.subjectTeachers, settings: S.settings };
  S.students.forEach((s) => { D.students[s.id] = { id: s.id, roomId: s.roomId, code: s.code || '', name: s.name, avatar: s.avatar }; });
  const aSet = {}, xSet = {};
  S.assignments.forEach((a) => { aSet[a.id] = 1; D.assignments[a.id] = { id: a.id, roomId: a.roomId, subjectId: a.subjectId, term: a.term, title: a.title, max: a.max, due: a.due || '', link: a.link || '', file: a.file || null }; });
  S.scoreItems.forEach((x) => { xSet[x.id] = 1; D.items[x.id] = { id: x.id, roomId: x.roomId, subjectId: x.subjectId, term: x.term, kind: x.kind, title: x.title, max: x.max }; });
  for (const aid in S.asg) {
    if (!aSet[aid]) continue;
    const r = {}; for (const sid in S.asg[aid]) { const m = S.asg[aid][sid]; r[sid] = (m.d ? 1 : 0) + '|' + (num(m.p) ? m.p : ''); }
    D.asg[aid] = { r };
  }
  for (const xid in S.sc) {
    if (!xSet[xid]) continue;
    const r = {}; for (const sid in S.sc[xid]) if (num(S.sc[xid][sid])) r[sid] = S.sc[xid][sid];
    D.sc[xid] = { r };
  }
  for (const d in S.att) D.att[d] = { r: Object.assign({}, S.att[d]) };
  return D;
}
function snapshot() {
  const docs = toDocs(), str = {};
  COLS.forEach((c) => { str[c] = {}; for (const id in docs[c]) str[c][id] = JSON.stringify(docs[c][id]); });
  return { docs, str };
}
function snapDiff(a, b) {
  for (const t of COLS) {
    const x = a[t] || {}, y = b[t] || {};
    for (const id in y) if (x[id] !== y[id]) return true;
    for (const id in x) if (!(id in y)) return true;
  }
  return false;
}
const clone = (o) => JSON.parse(JSON.stringify(o));

/* เอกสารในฐานข้อมูล -> S */
function buildS() {
  const R = C.raw, n = freshState(), vals = (c) => Object.keys(R[c] || {}).map((k) => R[c][k]);

  const cfg = (R.cfg && R.cfg.main) || {};
  n.rooms = cfg.rooms || [];
  n.subjects = (cfg.subjects || []).map((x) => Object.assign({ icon: 'book', color: 'green', credit: 1, collectW: 70, examW: 30 }, x));
  n.subjectTeachers = cfg.subjectTeachers || {};
  if (cfg.settings) { const v = cfg.settings; n.settings = { school: v.school || '', logo: v.logo || '', year: v.year || '', term: v.term || 1, scale: Array.isArray(v.scale) && v.scale.length ? v.scale : n.settings.scale, sign: [0, 1].map((i) => { const z = (Array.isArray(v.sign) && v.sign[i]) || {}, d = n.settings.sign[i]; return { t: z.t != null ? z.t : d.t, n: z.n || '', img: z.img || '' }; }) }; }
  n.students = vals('students').map((s) => ({ id: s.id, roomId: s.roomId, code: s.code || '', name: s.name, avatar: s.avatar || 'girl' }));
  const aSet = new Set(), xSet = new Set(), stuSet = new Set(n.students.map((s) => s.id));
  n.assignments = vals('assignments').map((r) => { aSet.add(r.id); const a = { id: r.id, roomId: r.roomId, subjectId: r.subjectId, term: r.term, title: r.title, max: r.max, due: r.due || '', link: r.link || '' }; if (r.file) a.file = r.file; return a; });
  n.scoreItems = vals('items').map((r) => { xSet.add(r.id); return { id: r.id, roomId: r.roomId, subjectId: r.subjectId, term: r.term, kind: r.kind, title: r.title, max: r.max }; });
  for (const aid in (R.asg || {})) {
    if (!aSet.has(aid)) continue;
    const r = (R.asg[aid] && R.asg[aid].r) || {}, out = {};
    for (const sid in r) { if (r[sid] == null || !stuSet.has(sid)) continue; const p = String(r[sid]).split('|'); const e = { d: p[0] === '1' ? 1 : 0 }; if (p[1] !== undefined && p[1] !== '') e.p = parseFloat(p[1]); out[sid] = e; }
    n.asg[aid] = out;
  }
  for (const xid in (R.sc || {})) {
    if (!xSet.has(xid)) continue;
    const r = (R.sc[xid] && R.sc[xid].r) || {}, out = {};
    for (const sid in r) if (num(r[sid]) && stuSet.has(sid)) out[sid] = r[sid];
    n.sc[xid] = out;
  }
  for (const d in (R.att || {})) {
    const r = (R.att[d] && R.att[d].r) || {}, out = {};
    for (const sid in r) if (r[sid] && stuSet.has(sid)) out[sid] = r[sid];
    if (Object.keys(out).length) n.att[d] = out;
  }

}
async function resolveNames() {

/* บันทึกขึ้นฐานข้อมูล เฉพาะเอกสารที่เปลี่ยน */
function queueSync() {
  if (!DB || !C.ready) return;
  clearTimeout(C.timer);
  C.timer = setTimeout(() => { C.timer = null; pushCloud(); }, 600);
}
async function pushCloud() {
  if (!DB || !C.ready) return;
  if (C.busy) { C.again = true; return; }
  C.busy = true; setSync('saving');
  let ok = true;
  try {
    const snap = snapshot();
    for (const col of COLS) {
      if (col === 'teachers') continue;
      const old = C.snap[col] || (C.snap[col] = {}), neu = snap.str[col];
      for (const id in neu) {
        if (neu[id] === old[id]) continue;
        const ref = DB.collection(col).doc(id), doc = snap.docs[col][id];
        if (R_COLS.indexOf(col) >= 0 && old[id]) {
          const o = JSON.parse(old[id]).r || {}, n = doc.r, ch = {}; let any = false;
          for (const k in n) if (o[k] !== n[k]) { ch[k] = n[k]; any = true; }
          for (const k in o) if (!(k in n)) { ch[k] = null; any = true; }
          if (any) await ref.update({ r: ch });
        } else await ref.set(doc);
        old[id] = neu[id];
      }
      for (const id in old) if (!(id in neu)) { await DB.collection(col).doc(id).delete(); delete old[id]; }
    }
  } catch (e) { ok = false; console.warn('save failed', e); setSync('error'); toast('บันทึกไม่สำเร็จ: ' + ((e && e.message) || 'ตรวจสิทธิ์และอินเทอร์เน็ต')); }
  C.busy = false;
  if (ok) setSync('synced');
  if (C.again) { C.again = false; queueSync(); }
  else if (C.deferred) scheduleRebuild();
}

/* รับการแก้ไขจากครูท่านอื่นแบบสด */
function safeToRender() {
  const a = document.activeElement;
  return $('#modal').hidden && !(a && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName));
}
function scheduleRebuild() { clearTimeout(C.rb); C.rb = setTimeout(rebuild, 200); }
function rebuild() {
  if (C.timer || C.busy) { C.deferred = true; return; }
  if (!safeToRender()) { C.deferred = true; C.rb = setTimeout(rebuild, 1500); return; }
  C.deferred = false;
  const before = snapshot().str;
  buildS();
  if (snapDiff(before, C.snap)) render();
}
function onCol(col, snap) {
  const m = {};
  snap.docs.forEach((d) => { m[d.id] = clone(d.data() || {}); });
  C.raw[col] = m; C.got[col] = true;
  if (!C.ready) {
    if (COLS.every((c) => C.got[c])) firstLoad();
  } else scheduleRebuild();
}
function firstLoad() {
  C.ready = true; buildS(); setSync('synced');
  if (!S.rooms.find((r) => r.id === V.roomId)) V.roomId = S.rooms[0] ? S.rooms[0].id : null;
  if (!S.subjects.find((x) => x.id === V.subjectId)) { const mine = S.subjects.find((x) => canTeach(x.id)); V.subjectId = (mine || S.subjects[0] || {}).id || null; }
  if (TERMS.indexOf(V.term) < 0 || !localStorage.getItem('abdia_ui')) V.term = S.settings.term || 1;
  saveUI(); enterApp();
  if (CAN_WRITE && MEID && !(C.raw.teachers && C.raw.teachers[MEID])) DB.doc('teachers/' + MEID).set({ id: MEID }).catch(() => {});
}
function enterApp() { $('#auth').hidden = true; render(); window.scrollTo(0, 0); }
async function manualRefresh() {

}

/* ============ attendance model ============ */
const ATT = { p: { t: 'มา', full: 'มาเรียน' }, l: { t: 'สาย', full: 'มาสาย' }, v: { t: 'ลา', full: 'ลา' }, a: { t: 'ขาด', full: 'ขาดเรียน' } };
function attOf(stuId) {
  const r = { p: 0, l: 0, v: 0, a: 0, days: 0, rate: null };
  for (const d in S.att) {
    const c = S.att[d][stuId];
    if (!c) continue;
    r.days++; r[c]++;
  }
  if (r.days) r.rate = Math.round(((r.p + r.l) / r.days) * 100);
  return r;
}
function dayRecorded(date) {
  const day = S.att[date];
  if (!day) return false;
  return roomStudents().some((s) => day[s.id]);
}
function setAtt(stuId, code) {
  if (!CAN_WRITE) { toast('บัญชีนี้ดูข้อมูลได้อย่างเดียว'); return; }
  const date = V.attDate;
  const had = dayRecorded(date);
  const day = S.att[date] || (S.att[date] = {});
  if (!had) roomStudents().forEach((s) => { day[s.id] = 'p'; });
  day[stuId] = code;
  commit(); render();
}
function markAll(code) {
  if (!CAN_WRITE) { toast('บัญชีนี้ดูข้อมูลได้อย่างเดียว'); return; }
  const day = S.att[V.attDate] || (S.att[V.attDate] = {});
  roomStudents().forEach((s) => { day[s.id] = code; });
  commit(); render();
}
function clearDay(date) {
  if (!CAN_WRITE) { toast('บัญชีนี้ดูข้อมูลได้อย่างเดียว'); return; }
  const day = S.att[date];
  if (day) {
    roomStudents().forEach((s) => { delete day[s.id]; });
    if (!Object.keys(day).length) delete S.att[date];
  }
  commit(); closeModal(); render();
}
function roomDates() {
  const ids = new Set(roomStudents().map((s) => s.id));
  const out = [];
  for (const d in S.att) { if (Object.keys(S.att[d]).some((k) => ids.has(k))) out.push(d); }
  return out.sort().reverse();
}

function parseStudentLine(raw) {
  let cols = raw.split('\t').map((c) => c.trim()).filter(Boolean);
  if (!cols.length) return null;
  if (cols.length >= 3 && /^\d{1,3}$/.test(cols[0])) cols.shift();
  if (cols.length >= 2 && /\d/.test(cols[0]) && !/[ก-๙]/.test(cols[0])) return { code: cols[0], name: cols.slice(1).join(' ') };
  let l = cols.join(' ').replace(/^\d{1,3}\s*[.)]\s+/, '');
  const m = /^(?=\S*\d)([A-Za-z0-9][A-Za-z0-9\-\/]*)\s+(.+)$/.exec(l);
  return m ? { code: m[1], name: m[2].trim() } : { code: '', name: l };
}

function saveStudents() {

/* ---- ไฟล์แนบ (ที่เก็บไฟล์ของแอพ) ---- */
const FILE_TYPES = { pdf: 'application/pdf', png: 'image/png', jpg: 'image/jpeg', jpeg: 'image/jpeg', gif: 'image/gif', webp: 'image/webp', svg: 'image/svg+xml', txt: 'text/plain', csv: 'text/csv', md: 'text/markdown', json: 'application/json', mp4: 'video/mp4', webm: 'video/webm' };
const MAX_FILE = 20 * 1024 * 1024;

function fmtSize(b) { return b >= 1048576 ? (b / 1048576).toFixed(1) + ' MB' : Math.max(1, Math.round(b / 1024)) + ' KB'; }
function fileProblem(f) {
  if (!fileKind(f)) return 'แนบได้เฉพาะ PDF รูปภาพ และไฟล์ข้อความ (ไฟล์ Word หรือ PowerPoint ให้บันทึกเป็น PDF ก่อน)';
  if (f.size > MAX_FILE) return 'ไฟล์ใหญ่เกิน 20 MB';
  if (!f.size) return 'ไฟล์ว่างเปล่า';
  return '';
}
async function uploadFile(f) {
  let as = null;
  try { as = await window.claude.use('assets'); } catch (e) { /* ignore */ }
  if (!as) throw { code: 'none', message: 'บัญชีนี้แนบไฟล์ไม่ได้ ต้องเป็นผู้ดูแล หรือเจ้าของแอพเปิดสิทธิ์อัปโหลดให้ครู' };
  const r = await as.upload(f, { type: fileKind(f) });
  return { id: r.id, name: f.name, size: f.size, type: r.contentType };
}
function uploadMsg(e) {
  const c = e && e.code;
  if (c === 'none') return e.message;
  if (c === 'too_large') return 'ไฟล์ใหญ่เกินกำหนด';
  if (c === 'unsupported_type') return 'ไฟล์ชนิดนี้แนบไม่ได้';
  if (c === 'quota_or_state') return 'พื้นที่เก็บไฟล์เต็ม ลบใบงานเก่าที่ไม่ใช้แล้วลองใหม่';
  if (c === 'rate_limited') return 'อัปโหลดถี่เกินไป รอสักครู่แล้วลองใหม่';
  return 'อัปโหลดไม่สำเร็จ ลองอีกครั้งนะคะ';
}
function fileLinkHTML(a) {
  if (a.file) return `<a class="pill v" href="#" onclick="event.stopPropagation();openWs('${a.id}');return false" title="${esc(a.file.name)}">${ic('link', 12)} เปิดไฟล์</a>`;
  if (a.link) return `<a class="pill v" href="${esc(a.link)}" target="_blank" rel="noopener" onclick="event.stopPropagation()">${ic('link', 12)} ลิงก์</a>`;

}
let _autoTitle = '';
function onPickFile(inp) {

  const max = parseFloat($('#na-max').value) > 0 ? parseFloat($('#na-max').value) : 10;

/* ---- เปิดดู / พิมพ์ไฟล์ใบงานในแอพ ---- */
const WS = { aid: null, zoom: 1, tok: 0 };
function wsKind(f) {
  const e = ((f.name || '').split('.').pop() || '').toLowerCase(), t = (f.type || '').toLowerCase();
  if (e === 'pdf' || t === 'application/pdf') return 'pdf';
  if (/^image\//.test(t) || ['png', 'jpg', 'jpeg', 'gif', 'webp', 'svg'].indexOf(e) >= 0) return 'img';
  if (/^video\//.test(t) || ['mp4', 'webm'].indexOf(e) >= 0) return 'video';
  return 'text';
}
function openWs(aid) {
  const a = S.assignments.find((x) => x.id === aid); if (!a || !a.file) return;
  WS.aid = aid; WS.zoom = 1;
  let o = document.getElementById('wsview');
  if (!o) { o = document.createElement('div'); o.id = 'wsview'; document.body.appendChild(o); }
  const f = a.file, k = wsKind(f);
  o.innerHTML = `<div id="wsbar"><button class="vb" onclick="closeWs()">✕ ปิด</button>
    <span class="trunc" style="flex:1;min-width:90px;font-size:13px;text-align:center">${esc(a.title)} · ${esc(f.name)}</span>
    ${k === 'pdf' || k === 'img' ? '<button class="vb" onclick="wsZoom(-0.25)" aria-label="ย่อ">➖</button><button class="vb" onclick="wsZoom(0.25)" aria-label="ขยาย">➕</button>' : ''}
    <button class="vb" onclick="wsPrint()">🖨 พิมพ์</button>
    <button class="vb" onclick="wsDownload()">⬇ ดาวน์โหลด</button>
    <a class="vb" href="${blobUrl(f.id)}" target="_blank" rel="noopener">↗ เปิดแท็บใหม่</a></div>
    <div id="wsbody"><p class="sm" style="text-align:center;padding:30px;color:#2b3a32">กำลังเปิดไฟล์…</p></div>`;
  wsRender();
}
function closeWs() { WS.tok++; const o = document.getElementById('wsview'); if (o) o.remove(); }
function wsZoom(d) { WS.zoom = Math.max(0.5, Math.min(3, WS.zoom + d)); wsRender(); }
function wsFail() {
  const a = S.assignments.find((x) => x.id === WS.aid), b = document.getElementById('wsbody'); if (!a || !b) return;
  const url = blobUrl(a.file.id);
  b.innerHTML = (wsKind(a.file) === 'pdf' ? `<iframe src="${url}" style="width:100%;height:calc(100% - 40px);min-height:60vh;border:0;background:#fff"></iframe>` : '')
    + `<p class="sm" style="text-align:center;padding:12px;color:#2b3a32">ถ้าไม่เห็นไฟล์ ให้กด "เปิดแท็บใหม่" หรือ "ดาวน์โหลด" ด้านบน</p>`;
}
async function wsRender() {
  const a = S.assignments.find((x) => x.id === WS.aid), b = document.getElementById('wsbody'); if (!a || !b) return;
  const f = a.file, k = wsKind(f), tok = ++WS.tok, url = blobUrl(f.id);
  const w = Math.round(Math.max(200, Math.min(b.clientWidth - 20, 900)) * WS.zoom);
  try {
    if (k === 'img') b.innerHTML = `<img class="pg" src="${url}" alt="${esc(f.name)}" style="width:${w}px;height:auto" onerror="wsFail()">`;
    else if (k === 'video') b.innerHTML = `<video controls playsinline src="${url}" style="display:block;max-width:100%;margin:0 auto;background:#000"></video>`;
    else if (k === 'pdf') await wsPdf(url, b, w, tok);
    else { const r = await fetch(url); if (!r.ok) throw new Error('fetch'); const t = await r.text(); if (tok === WS.tok) b.innerHTML = `<pre class="wstxt">${esc(t)}</pre>`; }
  } catch (e) { if (tok === WS.tok) wsFail(); }
}
let _pdfLib = null; const _pdfDocs = {};
function loadScriptTag(src) { return new Promise((res, rej) => { const s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = () => rej(new Error('load ' + src)); document.head.appendChild(s); }); }
async function getPdfLib() {
  if (_pdfLib) return _pdfLib;
  const base = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/';
  await loadScriptTag(base + 'pdf.min.js'); await loadScriptTag(base + 'pdf.worker.min.js');
  window.pdfjsLib.GlobalWorkerOptions.workerSrc = base + 'pdf.worker.min.js';
  return (_pdfLib = window.pdfjsLib);
}
async function wsPdf(url, b, w, tok) {
  const lib = await getPdfLib();
  let doc = _pdfDocs[url];
  if (!doc) { const r = await fetch(url); if (!r.ok) throw new Error('fetch'); doc = _pdfDocs[url] = await lib.getDocument({ data: new Uint8Array(await r.arrayBuffer()) }).promise; }
  if (tok !== WS.tok) return;
  b.innerHTML = '';
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  for (let i = 1; i <= doc.numPages; i++) {
    const pg = await doc.getPage(i); if (tok !== WS.tok) return;
    const sc = w / pg.getViewport({ scale: 1 }).width, vp = pg.getViewport({ scale: sc * dpr });
    const c = document.createElement('canvas'); c.width = Math.floor(vp.width); c.height = Math.floor(vp.height);
    c.style.width = w + 'px'; c.style.height = Math.floor(vp.height / dpr) + 'px';
    b.appendChild(c);
    await pg.render({ canvasContext: c.getContext('2d'), viewport: vp }).promise;
  }
}
function wsPrint() {
  toast('ถ้าไม่มีหน้าต่างพิมพ์ขึ้น ให้กด "เปิดแท็บใหม่" แล้วสั่งพิมพ์จากไฟล์นั้น');
  try { window.print(); } catch (e) { /* ถูกบล็อก */ }
}
async function wsDownload() {
  const a = S.assignments.find((x) => x.id === WS.aid); if (!a) return;
  try { const r = await fetch(blobUrl(a.file.id)); if (!r.ok) throw new Error('fetch'); await saveFile(a.file.name, await r.blob()); }

function setScore(id, sid, raw, max) {
  const x = S.scoreItems.find((i) => i.id === id); if (!x || !guard(x.subjectId)) return;
  const m = S.sc[id] || (S.sc[id] = {});
  if (raw === '' || raw == null) delete m[sid];
  else {
    let v = parseFloat(raw); if (isNaN(v) || v < 0) v = 0; if (v > max) v = max;
    m[sid] = round2(v);
    const inp = document.activeElement; if (inp && inp.tagName === 'INPUT') inp.value = m[sid];
  }
  commit();
}

/* ============ view: stats ============ */
function vStats() {
  const st = roomStudents(), rid = room().id;
  const att = st.map((s) => ({ s, a: attOf(s.id) }));
  const missing = st.map((s) => {
    let n = 0;
    S.assignments.filter((a) => a.roomId === rid).forEach((a) => { if (!(S.asg[a.id] && S.asg[a.id][s.id] && S.asg[a.id][s.id].d)) n++; });
    return { s, n };
  }).filter((x) => x.n > 0).sort((a, b) => b.n - a.n).slice(0, 5);
  const low = att.filter((x) => x.a.rate != null && x.a.rate < 80).sort((a, b) => a.a.rate - b.a.rate).slice(0, 5);

  const subjRows = S.subjects.map((sj) => {
    const asgs = S.assignments.filter((a) => a.roomId === rid && a.subjectId === sj.id);
    const slots = asgs.length * st.length;
    let sub = 0;
    asgs.forEach((a) => st.forEach((s) => { if (S.asg[a.id] && S.asg[a.id][s.id] && S.asg[a.id][s.id].d) sub++; }));
    const sp = slots ? Math.round((sub / slots) * 100) : null;
    let got = 0, poss = 0;
    S.scoreItems.filter((x) => x.roomId === rid && x.subjectId === sj.id).forEach((x) => st.forEach((s) => { const v = S.sc[x.id] && S.sc[x.id][s.id]; if (num(v)) { got += v; poss += x.max; } }));
    const ap = poss ? Math.round((got / poss) * 100) : null;
    return `<div class="srow"><div class="row between"><span class="row"><span class="sico c-${sj.color}">${ic(sj.icon, 14)}</span><b>${esc(sj.name)}</b></span><span class="pill n">คะแนนเฉลี่ย ${ap == null ? '–' : ap + '%'}</span></div>
      <div class="row between xs muted" style="margin-top:8px"><span>การส่งงาน</span><b>${sp == null ? 'ยังไม่มีใบงาน' : sp + '%'}</b></div><div class="bar" style="margin-top:4px"><i style="width:${sp || 0}%"></i></div></div>`;
  }).join('');

  return `<div class="pagehead"><div><h2 class="h2">สถิติและภาพรวม</h2><p class="sm muted">ห้อง ${esc(room().name)} · ${st.length} คน</p></div></div>

      <div class="sect"><div class="sm muted" style="margin-bottom:6px">ค้างส่งงานมากที่สุด</div>${missing.length ? missing.map((x) => `<div class="row between" style="padding:6px 0;border-bottom:1px dashed var(--line)"><span class="trunc">${esc(x.s.name)}</span><span class="pill a">ค้าง ${x.n} ชิ้น</span></div>`).join('') : '<div class="sm muted">ไม่มีงานค้าง</div>'}</div>
      <div class="sect"><div class="sm muted" style="margin-bottom:6px">เข้าเรียนต่ำกว่า 80%</div>${low.length ? low.map((x) => `<div class="row between" style="padding:6px 0;border-bottom:1px dashed var(--line)"><span class="trunc">${esc(x.s.name)}</span><span class="pill a">${x.a.rate}% · ขาด ${x.a.a} สาย ${x.a.l}</span></div>`).join('') : '<div class="sm muted">ยังไม่มีใครต่ำกว่าเกณฑ์</div>'}</div>
    </div>
    <div class="card"><div class="row between wrapx"><h3 class="h3">การเข้าเรียนรายบุคคล</h3><span class="pill n">${roomDates().length} วันที่เช็คชื่อ</span></div>
      <div style="margin-top:10px">${att.length ? att.map((x) => `<div class="srow"><div class="row between"><span class="row" style="min-width:0"><div class="avatar sm2">${avatarSVG(x.s.avatar)}</div><b class="trunc">${esc(x.s.name)}</b></span><span class="rate">${x.a.rate == null ? '–' : x.a.rate + '%'}</span></div>
        <div class="mini"><span>มา <b class="p">${x.a.p}</b></span><span>สาย <b class="l">${x.a.l}</b></span><span>ลา <b class="v">${x.a.v}</b></span><span>ขาด <b class="a">${x.a.a}</b></span></div></div>`).join('') : '<div class="empty">ยังไม่มีนักเรียน</div>'}</div></div>

/* ============ grades: คำนวณเกรดอัตโนมัติ ============ */
function collectItems(rid, sid, term) {
  const out = [];
  S.assignments.forEach((a) => { if (a.roomId === rid && a.subjectId === sid && a.term === term) out.push({ k: 'a', id: a.id, max: a.max, title: a.title }); });
  S.scoreItems.forEach((x) => { if (x.roomId === rid && x.subjectId === sid && x.term === term && x.kind !== 'exam') out.push({ k: 's', id: x.id, max: x.max, title: x.title }); });
  return out;
}
const examItem = (rid, sid, term) => S.scoreItems.find((x) => x.roomId === rid && x.subjectId === sid && x.term === term && x.kind === 'exam');
function markVal(item, stuId) {
  return item.k === 'a' ? (S.asg[item.id] && S.asg[item.id][stuId] && S.asg[item.id][stuId].p) : (S.sc[item.id] && S.sc[item.id][stuId]);
}
/* ตัดเกรดตามช่วงคะแนนในหน้าตั้งค่า */
function gradeOfPct(p) {
  const sc = S.settings.scale.slice().sort((a, b) => b[0] - a[0]);
  for (const r of sc) if (p >= r[0]) return r[1];
  return 0;
}
const fmtG = (g) => (g == null ? '–' : String(Math.round(g * 10) / 10));
/* รายการคะแนนเก็บที่ "มีผลแล้ว" (มีนักเรียนอย่างน้อย 1 คนมีคะแนน) ช่องว่างของรายการนั้นนับเป็น 0 */
function termCtx(rid, sid, term) {
  const sub = S.subjects.find((x) => x.id === sid) || NO_SUBJ;
  const stu = S.students.filter((s) => s.roomId === rid);
  const items = collectItems(rid, sid, term).filter((it) => stu.some((s) => num(markVal(it, s.id))));
  const ex = examItem(rid, sid, term);
  const exGraded = ex && stu.some((s) => num(S.sc[ex.id] && S.sc[ex.id][s.id]));
  return { sub, items, collMax: items.reduce((p, c) => p + c.max, 0), ex: exGraded ? ex : null };
}
function ctxOf(rid, sid, term) { const k = rid + '|' + sid + '|' + term; return CTX[k] || (CTX[k] = termCtx(rid, sid, term)); }
function calcStudent(ctx, stuId) {
  const w1 = ctx.sub.collectW, w2 = ctx.sub.examW;
  let got = 0;
  ctx.items.forEach((it) => { const v = markVal(it, stuId); if (num(v)) got += v; });
  const collPct = ctx.collMax ? got / ctx.collMax : null;
  let examPct = null;
  if (ctx.ex) { const v = S.sc[ctx.ex.id] && S.sc[ctx.ex.id][stuId]; examPct = ctx.ex.max ? (num(v) ? v : 0) / ctx.ex.max : null; }
  const collScore = collPct == null ? null : round2(collPct * w1);
  const examScore = examPct == null ? null : round2(examPct * w2);
  let total = null, status = '';
  if (collScore == null) status = 'ยังไม่มีคะแนนเก็บ'; else if (examScore == null) status = 'รอผลสอบ'; else total = round2(collScore + examScore);
  const pct = total == null || !(w1 + w2) ? null : round2((total / (w1 + w2)) * 100);
  return { collScore, examScore, total, pct, grade: pct == null ? null : gradeOfPct(pct), status };
}
const termResult = (rid, sub, stuId, term) => calcStudent(ctxOf(rid, sub.id, term), stuId);
function yearResult(rid, sub, stuId) {
  const a = termResult(rid, sub, stuId, 1), b = termResult(rid, sub, stuId, 2);
  if (a.pct == null || b.pct == null) return { a, b, pct: null, grade: null };
  const pct = round2((a.pct + b.pct) / 2);
  return { a, b, pct, grade: gradeOfPct(pct) };
}
function gpaOf(list) {
  let sw = 0, s = 0;
  list.forEach((x) => { if (x.grade != null) { s += x.grade * x.credit; sw += x.credit; } });
  return sw ? Math.round((s / sw) * 100) / 100 : null;
}
const fmtGpa = (g) => (g == null ? '–' : g.toFixed(2));

function pickLogo(inp) {
  const f = inp.files && inp.files[0]; inp.value = '';
  if (!f || !isAdmin()) return;
  if (!/^image\//.test(f.type)) { toast('เลือกไฟล์รูปภาพเท่านั้น'); return; }
  const rd = new FileReader();
  rd.onload = () => {
    const img = new Image();
    img.onload = () => {
      let max = 240, url = '';
      for (let i = 0; i < 4; i++) {
        const k = Math.min(1, max / Math.max(img.width || 1, img.height || 1)), c = document.createElement('canvas');
        c.width = Math.max(1, Math.round((img.width || 1) * k)); c.height = Math.max(1, Math.round((img.height || 1) * k));
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        url = c.toDataURL('image/png');
        if (url.length < 120000) break;
        max = Math.round(max * 0.7);
      }
      if (url.length >= 120000) { toast('รูปโลโก้ซับซ้อนเกินไป ลองใช้รูปที่เรียบกว่านี้'); return; }
      S.settings.logo = url; commit(); render(); toast('ตั้งโลโก้แล้ว');
    };
    img.onerror = () => toast('อ่านรูปไม่สำเร็จ');
    img.src = rd.result;
  };
  rd.readAsDataURL(f);
}
function clearLogo() { S.settings.logo = ''; commit(); render(); }

const SIGN_TITLES = ['ครูประจำชั้น', 'ผู้อำนวยการ', 'รองผู้อำนวยการ', 'หัวหน้าฝ่ายวิชาการ', 'หัวหน้าระดับชั้น', 'นายทะเบียน'];
const SIGN_CACHE = {};
const blobUrl = (id) => '/_blob/' + encodeURIComponent(id);
function signSlot(i) { const d = [{ t: 'ครูประจำชั้น' }, { t: 'ผู้อำนวยการ' }][i], z = (S.settings.sign || [])[i] || {}; return { t: z.t != null ? z.t : d.t, n: z.n || '', img: z.img || '' }; }
function signBlockHTML(file) {
  return [0, 1].map((i) => {
    const z = signSlot(i), src = z.img ? (file ? SIGN_CACHE[z.img] : blobUrl(z.img)) : '';
    return `<div><div class="sgi">${src ? `<img src="${src}" alt="" onerror="this.style.display='none'">` : ''}</div><div class="sgl">........................................</div>${z.n ? `<div>(${esc(z.n)})</div>` : ''}<div>${esc(z.t)}</div></div>`;
  }).join('');
}
async function signData() {
  for (const i of [0, 1]) {
    const id = signSlot(i).img; if (!id || SIGN_CACHE[id]) continue;
    try {
      const r = await fetch(blobUrl(id)); if (!r.ok) continue;

async function dropSignAsset(id) {
  if (!id) return;
  try { const as = await window.claude.use('assets'); if (as) await as.delete(id); } catch (e) { /* best effort */ }
}
function loadImgFile(f) {
  return new Promise((res, rej) => {
    const u = URL.createObjectURL(f), im = new Image();
    im.onload = () => { URL.revokeObjectURL(u); res(im); }; im.onerror = () => { URL.revokeObjectURL(u); rej(new Error('img')); }; im.src = u;
  });
}
async function pickSign(i, inp) {
  const f = inp.files && inp.files[0]; inp.value = '';
  if (!f || !isAdmin()) return;
  if (!/^image\/(png|jpe?g|webp|gif)$/.test(f.type)) { toast('เลือกไฟล์รูป PNG หรือ JPG'); return; }
  collectSign();
  toast('กำลังประมวลผลรูปลายเซ็น…');
  try {
    const im = await loadImgFile(f), k = Math.min(1, 700 / Math.max(im.width, im.height, 1));
    let c = document.createElement('canvas'); c.width = Math.max(1, Math.round(im.width * k)); c.height = Math.max(1, Math.round(im.height * k));
    let x = c.getContext('2d', { willReadFrequently: true }); x.drawImage(im, 0, 0, c.width, c.height);
    const d = x.getImageData(0, 0, c.width, c.height), px = d.data;
    let opaque = true;
    for (let p = 3; p < px.length; p += 4) { if (px[p] < 250) { opaque = false; break; } }
    if (opaque) {
      for (let p = 0; p < px.length; p += 4) {
        const lum = 0.299 * px[p] + 0.587 * px[p + 1] + 0.114 * px[p + 2];
        px[p + 3] = lum >= 238 ? 0 : lum <= 170 ? 255 : Math.round(255 * (238 - lum) / 68);
      }
      x.putImageData(d, 0, 0);
    }
    let x0 = c.width, y0 = c.height, x1 = -1, y1 = -1;
    for (let yy = 0; yy < c.height; yy++) for (let xx = 0; xx < c.width; xx++) { if (px[(yy * c.width + xx) * 4 + 3] > 12) { if (xx < x0) x0 = xx; if (xx > x1) x1 = xx; if (yy < y0) y0 = yy; if (yy > y1) y1 = yy; } }
    if (x1 < 0) { toast('ไม่พบลายเซ็นในรูป ลองรูปที่ชัดกว่านี้'); return; }
    const pad = 4; x0 = Math.max(0, x0 - pad); y0 = Math.max(0, y0 - pad); x1 = Math.min(c.width - 1, x1 + pad); y1 = Math.min(c.height - 1, y1 + pad);
    const o = document.createElement('canvas'); o.width = x1 - x0 + 1; o.height = y1 - y0 + 1;
    o.getContext('2d').drawImage(c, x0, y0, o.width, o.height, 0, 0, o.width, o.height);
    const blob = await new Promise((r) => o.toBlob(r, 'image/png'));
    if (!blob) throw new Error('blob');
    const as = await window.claude.use('assets');
    if (!as) { toast('บัญชีนี้อัปโหลดรูปไม่ได้ (ต้องเป็นผู้ดูแลแอพ)'); return; }
    const r = await as.upload(new File([blob], 'signature.png', { type: 'image/png' }), { type: 'image/png' });
    const old = S.settings.sign[i].img;
    S.settings.sign[i].img = r.id; commit(); render();
    toast(opaque ? 'ตั้งลายเซ็นแล้ว (ทำพื้นขาวให้โปร่งใสให้แล้ว)' : 'ตั้งลายเซ็นแล้ว');
    dropSignAsset(old);
  } catch (e) { toast(e && e.code ? uploadMsg(e) : 'อ่านรูปไม่สำเร็จ ลองรูปอื่น'); }
}
function clearSign(i) {
  collectSign();
  const old = S.settings.sign[i].img; S.settings.sign[i].img = ''; commit(); render(); dropSignAsset(old);
}

function saveSubject(id) {

/* ============ export / backup ============ */
async function saveFile(name, data) {
  let dl = null;
  try { dl = await window.claude.use('downloads'); } catch (e) { /* ignore */ }
  if (!dl) { toast('มุมมองนี้ดาวน์โหลดไฟล์ไม่ได้ ลองเปิดแอพนี้ใน Claude โดยตรง'); return false; }
  try { await dl.save({ filename: name, data }); return true; }
  catch (e) { if (!(e && e.code === 'declined')) toast('บันทึกไฟล์ไม่สำเร็จ'); return false; }
}
function sheetName(name, used) {
  let n = name.replace(/[\\\/?*\[\]:]/g, '_').slice(0, 31) || 'Sheet';
  const base = n; let i = 2;
  while (used.has(n.toLowerCase())) { n = base.slice(0, 28) + '_' + i++; }
  used.add(n.toLowerCase());
  return n;
}
function gradeSheet(gt) {
  const rid = room().id;
  return roomStudents().map((s, i) => {
    const r = { 'ลำดับ': i + 1, 'รหัสนักเรียน': s.code, 'ชื่อ-นามสกุล': s.name }, list = [];
    S.subjects.forEach((sub) => {
      if (gt === 'y') {
        const y = yearResult(rid, sub, s.id); list.push({ grade: y.grade, credit: sub.credit });
        r[sub.name + ' เทอม1'] = y.a.total == null ? '' : y.a.total; r[sub.name + ' เทอม2'] = y.b.total == null ? '' : y.b.total;
        r[sub.name + ' เฉลี่ย%'] = y.pct == null ? '' : y.pct; r[sub.name + ' เกรด'] = y.grade == null ? '' : y.grade;
      } else {
        const t = termResult(rid, sub, s.id, gt); list.push({ grade: t.grade, credit: sub.credit });
        r[sub.name + ' เก็บ'] = t.collScore == null ? '' : t.collScore; r[sub.name + ' สอบ'] = t.examScore == null ? '' : t.examScore;
        r[sub.name + ' รวม'] = t.total == null ? '' : t.total; r[sub.name + ' เกรด'] = t.grade == null ? '' : t.grade;
      }
    });
    const gp = gpaOf(list); r['GPA'] = gp == null ? '' : gp;
    return r;
  });
}
async function exportXlsx() {
  const st = roomStudents();
  if (!st.length) { toast('ยังไม่มีนักเรียนในห้องนี้ เพิ่มรายชื่อก่อนส่งออกนะคะ'); return; }
  if (typeof XLSX === 'undefined') { toast('โหลดตัวสร้างไฟล์ Excel ไม่สำเร็จ ลองรีเฟรชหน้านี้อีกครั้ง'); return; }
  try {
    const rname = room().name, rid = room().id, used = new Set(), wb = XLSX.utils.book_new();
    const add = (rows, name) => XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(rows), sheetName(name, used));
    add(gradeSheet(1), 'ใบเกรดเทอม1'); add(gradeSheet(2), 'ใบเกรดเทอม2'); add(gradeSheet('y'), 'ใบเกรดทั้งปี');
    add(st.map((s, i) => { const a = attOf(s.id); return { 'ลำดับ': i + 1, 'รหัสนักเรียน': s.code, 'ชื่อ-นามสกุล': s.name, 'ชั้น': rname, 'จำนวนวันที่เช็คชื่อ': a.days, 'มาเรียน': a.p, 'มาสาย': a.l, 'ลา': a.v, 'ขาดเรียน': a.a, 'อัตราการเข้าเรียน (%)': a.rate == null ? '' : a.rate }; }), 'สรุปการเข้าเรียน');
    const dates = roomDates().slice().reverse();
    if (dates.length) {
      const code = { p: 'ม', l: 'ส', v: 'ล', a: 'ข' };
      add(st.map((s, i) => { const r = { 'ลำดับ': i + 1, 'รหัสนักเรียน': s.code, 'ชื่อ-นามสกุล': s.name }; dates.forEach((d) => { r[fmtDate(d)] = (S.att[d] && S.att[d][s.id]) ? code[S.att[d][s.id]] : ''; }); return r; }), 'เช็คชื่อรายวัน (ม ส ล ข)');
    }
    S.subjects.forEach((sj) => TERMS.forEach((term) => {
      const cols = collectItems(rid, sj.id, term), ex = examItem(rid, sj.id, term);
      const all = cols.concat(ex ? [{ k: 's', id: ex.id, title: ex.title + ' (สอบ)', max: ex.max }] : []);
      if (!all.length) return;
      add(st.map((s, i) => {
        const r = { 'ลำดับ': i + 1, 'รหัสนักเรียน': s.code, 'ชื่อ-นามสกุล': s.name };
        all.forEach((c) => { const v = markVal(c, s.id); r[c.title + ' (เต็ม ' + c.max + ')'] = num(v) ? v : ''; });
        return r;
      }), sj.name + ' ท' + term);
    }));
    const out = XLSX.write(wb, { bookType: 'xlsx', type: 'array' });
    if (await saveFile('ABDIA_' + rname.replace(/[\\\/:*?"<>|]/g, '-') + '_' + today() + '.xlsx', new Blob([out], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' }))) toast('บันทึกไฟล์ Excel แล้ว');
  } catch (e) { console.warn(e); toast('ส่งออกไม่สำเร็จ ลองอีกครั้งนะคะ'); }
}
async function exportBackup() {
  const o = { v: 6, rooms: S.rooms, subjects: S.subjects, subjectTeachers: S.subjectTeachers, students: S.students, assignments: S.assignments, scoreItems: S.scoreItems, asg: S.asg, sc: S.sc, att: S.att, settings: S.settings };
  if (await saveFile('abdia-backup-' + today() + '.json', JSON.stringify(o))) toast('บันทึกไฟล์สำรองแล้ว');

function importBackup(input) {
  const f = input.files && input.files[0]; input.value = '';
  if (!f) return;
  const rd = new FileReader();
  rd.onload = () => {
    try {
      const o = JSON.parse(rd.result);
      if (!o || !Array.isArray(o.rooms) || !Array.isArray(o.students)) throw new Error('bad');
      window._pendingRestore = o;
      askConfirm('นำเข้าไฟล์สำรอง', 'ข้อมูลในฐานข้อมูลกลางจะถูกแทนที่ด้วยข้อมูลจากไฟล์ (' + o.students.length + ' นักเรียน, ' + o.rooms.length + ' ห้อง) ครูทุกคนจะเห็นข้อมูลใหม่', 'doRestore()', 'นำเข้า');
    } catch (e) { toast('ไฟล์นี้ไม่ใช่ไฟล์สำรองของแอพนี้'); }
  };
  rd.readAsText(f);
}
function doRestore() {
  const o = window._pendingRestore; window._pendingRestore = null;
  if (!o || !isAdmin()) return;
  const n = freshState();
  n.me = S.me; n.profiles = S.profiles; n.subjectTeachers = o.subjectTeachers || S.subjectTeachers;
  n.rooms = o.rooms || [];
  n.subjects = (o.subjects || []).map((x) => Object.assign({ icon: 'book', color: 'green', credit: 1, collectW: 70, examW: 30 }, x));
  n.students = (o.students || []).map((s) => Object.assign({ code: '', avatar: 'girl' }, s));
  n.assignments = (o.assignments || []).map((a) => Object.assign({ term: 1, link: '', due: '' }, a));
  n.scoreItems = (o.scoreItems || []).map((x) => Object.assign({ term: 1, kind: 'item' }, x));
  n.asg = o.asg || {}; n.sc = o.sc || {}; n.att = o.att || {};
  n.settings = Object.assign(n.settings, o.settings || {});
  S = n; V.roomId = null; V.subjectId = null;
  commit(); closeModal(); render(); toast('นำเข้าข้อมูลแล้ว กำลังบันทึกขึ้นฐานข้อมูล');
}

/* ============ modal / toast / confirm ============ */
let _confirmFn = null;
function modal(html, focusId) {
  $('#modalbox').innerHTML = html;
  $('#modal').hidden = false;
  if (focusId) { const el = document.getElementById(focusId); if (el) setTimeout(() => el.focus(), 30); }
}
function closeModal() { $('#modal').hidden = true; $('#modalbox').innerHTML = ''; _confirmFn = null; }
function askConfirm(title, text, fnCall, okLabel) {
  _confirmFn = fnCall;
  const danger = !okLabel;
  modal(`<div style="text-align:center;padding:6px 2px">
    <div style="color:${danger ? 'var(--a)' : 'var(--sage-d)'};margin-bottom:6px">${ic(danger ? 'warn' : 'check', 32)}</div>
    <h3 class="h3">${esc(title)}</h3><p class="sm muted" style="margin-top:6px">${esc(text)}</p>
    <div class="btnrow"><button class="btn" onclick="closeModal()">ยกเลิก</button><button class="btn ${danger ? 'danger' : 'primary'}" onclick="runConfirm()">${esc(okLabel || 'ลบ')}</button></div></div>`);
}
function runConfirm() {
  const f = _confirmFn; _confirmFn = null;
  const m = f && /^(\w+)\((?:'([^']*)')?\)$/.exec(f);
  if (m && typeof window[m[1]] === 'function') window[m[1]](m[2]);
}
let _tt = null;
function toast(msg) {
  const t = $('#toast'); t.textContent = msg; t.hidden = false;
  clearTimeout(_tt); _tt = setTimeout(() => { t.hidden = true; }, 3200);
}
document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && !$('#modal').hidden) closeModal(); });
$('#modal').addEventListener('mousedown', (e) => { if (e.target.id === 'modal') closeModal(); });
